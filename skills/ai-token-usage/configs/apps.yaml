# =============================================================================
# AI Token Usage - External Tool Registry
# =============================================================================
# Drop-in extension for skills/laptop-setup.
# Install:
#   python3 skills/laptop-setup/scripts/laptop_setup.py --install \
#     --apps-file skills/ai-token-usage/configs/apps.yaml \
#     --profile ai-token-usage
# =============================================================================

settings:
  ensure_package_manager: true
  log_file: "ai_token_usage_setup.log"

apps:
  # Required to run the bundled token usage scripts.
  - name: "Python 3"
    profiles: ["ai-token-usage", "core"]
    category: "runtime"
    platforms: [macos, windows, linux]
    check_command: "python3"
    install_macos: "brew install python"
    install_windows: "winget install -e --id Python.Python.3.12"
    install_linux_apt: "sudo apt-get update && sudo apt-get install -y python3 python3-pip"
    install_linux_dnf: "sudo dnf install -y python3 python3-pip"

  # Optional but recommended: renders the report's chart.png trend panel.
  - name: "matplotlib"
    description: "Python charting library used to render the report's PNG trend charts (chart.png). Without it the report still runs; only the image is skipped."
    profiles: ["ai-token-usage"]
    category: "python-package"
    platforms: [macos, windows, linux]
    check_shell: "python3 -c \"import matplotlib\""
    check_windows_shell: "python -c \"import matplotlib\""
    install_macos: "python3 -m pip install matplotlib"
    install_windows: "python -m pip install matplotlib"
    install_linux_apt: "python3 -m pip install matplotlib"
    install_linux_dnf: "python3 -m pip install matplotlib"
