    install_linux_dnf: "sudo dnf install -y firefox"
    install_linux_snap: "sudo snap install firefox"

  # ── Version Control ────────────────────────────────────────────────────
  - name: Git
    description: Distributed version control system
    profiles: [baseline]
    platforms: [macos, windows, linux]
    check_command: git
    install_macos: "brew install git"
    install_windows: "winget install -e --id Git.Git --accept-package-agreements --accept-source-agreements"
    install_linux_apt: "sudo apt install -y git"
    install_linux_dnf: "sudo dnf install -y git"
    # Configure global Git identity. Provide GIT_USER_NAME and
    # GIT_USER_EMAIL via --credentials-file for headless setup; otherwise
    # the user is prompted for each value.
    configure_macos:
      - name: "Set global user.name"
        check: "git config --global --get user.name >/dev/null"
        interactive: "printf 'Git user.name: ' && read NAME && git config --global user.name \"$NAME\""
        non_interactive: "git config --global user.name \"$GIT_USER_NAME\""
        requires: [GIT_USER_NAME]
      - name: "Set global user.email"
        check: "git config --global --get user.email >/dev/null"
        interactive: "printf 'Git user.email: ' && read EMAIL && git config --global user.email \"$EMAIL\""
        non_interactive: "git config --global user.email \"$GIT_USER_EMAIL\""
        requires: [GIT_USER_EMAIL]
    configure_linux:
      - name: "Set global user.name"
        check: "git config --global --get user.name >/dev/null"
        interactive: "printf 'Git user.name: ' && read NAME && git config --global user.name \"$NAME\""
        non_interactive: "git config --global user.name \"$GIT_USER_NAME\""
        requires: [GIT_USER_NAME]
      - name: "Set global user.email"
        check: "git config --global --get user.email >/dev/null"
        interactive: "printf 'Git user.email: ' && read EMAIL && git config --global user.email \"$EMAIL\""
        non_interactive: "git config --global user.email \"$GIT_USER_EMAIL\""
        requires: [GIT_USER_EMAIL]
    configure_windows:
      - name: "Set global user.name"
        check: "git config --global --get user.name >NUL"
        interactive: "powershell -NoProfile -Command \"$n = Read-Host 'Git user.name'; git config --global user.name $n\""
        non_interactive: "git config --global user.name \"%GIT_USER_NAME%\""
        requires: [GIT_USER_NAME]
      - name: "Set global user.email"
        check: "git config --global --get user.email >NUL"
        interactive: "powershell -NoProfile -Command \"$e = Read-Host 'Git user.email'; git config --global user.email $e\""
        non_interactive: "git config --global user.email \"%GIT_USER_EMAIL%\""
        requires: [GIT_USER_EMAIL]

  - name: GitHub CLI
    description: GitHub command-line tool (gh)
    profiles: [baseline]
    platforms: [macos, windows, linux]
    check_command: gh
    install_macos: "brew install gh"
    install_windows: "winget install -e --id GitHub.cli --accept-package-agreements --accept-source-agreements"
    install_linux_apt: "sudo apt install -y gh"
    install_linux_dnf: "sudo dnf install -y gh"
    # Example of the new configure_<os> schema with both interactive and
    # non-interactive modes. Provide GH_TOKEN via --credentials-file or env
    # to enable headless auth; otherwise the interactive `gh auth login`
    # flow is used.
    configure_macos:
      - name: "Authenticate to GitHub"
        check: "gh auth status >/dev/null 2>&1"
        interactive: "gh auth login"
        non_interactive: 'printf "%s" "$GH_TOKEN" | gh auth login --with-token'
        requires: [GH_TOKEN]
        sensitive: true
    configure_linux:
      - name: "Authenticate to GitHub"
        check: "gh auth status >/dev/null 2>&1"
        interactive: "gh auth login"
        non_interactive: 'printf "%s" "$GH_TOKEN" | gh auth login --with-token'
        requires: [GH_TOKEN]
        sensitive: true
    configure_windows:
      - name: "Authenticate to GitHub"
        check: "gh auth status >/dev/null 2>&1"
        interactive: "gh auth login"
        non_interactive: 'echo %GH_TOKEN% | gh auth login --with-token'
        requires: [GH_TOKEN]
        sensitive: true
