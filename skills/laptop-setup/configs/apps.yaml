  # ── IDEs & Editors ─────────────────────────────────────────────────────
  - name: Android Studio
    description: Android development IDE
    profiles: [mobile, android]
    platforms: [macos, windows, linux]
    check_macos_path: "/Applications/Android Studio.app"
    check_linux_command: android-studio
    install_macos: "brew install --cask android-studio"
    install_windows: "winget install -e --id Google.AndroidStudio --accept-package-agreements --accept-source-agreements"
    install_linux_snap: "sudo snap install android-studio --classic"
    install_macos_note: "Post-install configures: SDK cmdline-tools, platform-tools, emulator, Android 15 (API 35) system image, default Pixel AVD, and ANDROID_HOME in .zshrc."
    post_install_macos:
      - "brew install --cask android-commandlinetools"
      - "export ANDROID_HOME=\"$HOME/Library/Android/sdk\" && mkdir -p \"$ANDROID_HOME\" && yes | \"$(brew --prefix)/share/android-commandlinetools/cmdline-tools/bin/sdkmanager\" --sdk_root=\"$ANDROID_HOME\" --licenses > /dev/null 2>&1"
      - "export ANDROID_HOME=\"$HOME/Library/Android/sdk\" && \"$(brew --prefix)/share/android-commandlinetools/cmdline-tools/bin/sdkmanager\" --sdk_root=\"$ANDROID_HOME\" \"cmdline-tools;latest\" \"platform-tools\" \"emulator\" \"build-tools;35.0.0\" \"platforms;android-35\" \"system-images;android-35;google_apis;arm64-v8a\""
      - "export ANDROID_HOME=\"$HOME/Library/Android/sdk\" && echo no | \"$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager\" create avd -n default_pixel -k \"system-images;android-35;google_apis;arm64-v8a\" -d \"pixel_6\" --force"
      - "grep -q 'ANDROID_HOME' ~/.zshrc 2>/dev/null || (echo '' >> ~/.zshrc && echo '# Android SDK' >> ~/.zshrc && echo 'export ANDROID_HOME=\"$HOME/Library/Android/sdk\"' >> ~/.zshrc && echo 'export PATH=\"$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH\"' >> ~/.zshrc)"
    verify_macos:
      - label: "Android Studio"
        command: "ls -d '/Applications/Android Studio.app' 2>/dev/null && echo 'Installed' || echo 'Not installed'"
      - label: "ANDROID_HOME"
        command: "echo \"${ANDROID_HOME:-not set}\""
      - label: "SDK packages"
        command: "ls ~/Library/Android/sdk/ 2>/dev/null || echo 'SDK not found'"
      - label: "SDK cmdline-tools"
        command: "ls ~/Library/Android/sdk/cmdline-tools/ 2>/dev/null || echo 'Not installed'"
      - label: "System images"
        command: "find ~/Library/Android/sdk/system-images -mindepth 3 -maxdepth 3 -type d 2>/dev/null | sed 's|.*/system-images/||' || echo 'None'"
      - label: "AVDs (emulators)"
        command: "~/Library/Android/sdk/emulator/emulator -list-avds 2>/dev/null || echo 'Emulator not installed'"
      - label: "Emulator binary"
        command: "ls ~/Library/Android/sdk/emulator/emulator 2>/dev/null && echo 'Present' || echo 'Not found'"

  - name: Visual Studio Code
    description: Code editor
    profiles: [baseline]
    platforms: [macos, windows, linux]
    check_command: code
    check_macos_path: "/Applications/Visual Studio Code.app"
    install_macos: "brew install --cask visual-studio-code"
    install_windows: "winget install -e --id Microsoft.VisualStudioCode --accept-package-agreements --accept-source-agreements"
    install_linux_snap: "sudo snap install code --classic"

  - name: Xcode
    description: Apple development IDE & toolchain
    profiles: [mobile, ios]
    platforms: [macos]
    check_macos_path: "/Applications/Xcode.app"
    install_macos: "xcode-select --install"
    install_macos_note: "Post-install installs full Xcode via App Store (mas), accepts license, runs first-launch setup, and downloads the iOS Simulator runtime."
    post_install_macos:
      - "command -v mas >/dev/null 2>&1 || brew install mas"
      - "test -d /Applications/Xcode.app || mas install 497799835 || echo 'Auto-install failed — please install Xcode manually from App Store'"
      - "test -d /Applications/Xcode.app && sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true"
      - "test -d /Applications/Xcode.app && sudo xcodebuild -license accept || true"
      - "test -d /Applications/Xcode.app && xcodebuild -runFirstLaunch || true"
      - "test -d /Applications/Xcode.app && xcodebuild -downloadPlatform iOS || echo 'iOS Simulator requires full Xcode from App Store'"
    verify_macos:
      - label: "Xcode version"
        command: "xcodebuild -version 2>/dev/null | head -1 || echo 'Not installed'"
      - label: "Active developer dir"
        command: "xcode-select -p 2>/dev/null || echo 'Not set'"
      - label: "iOS Simulator runtimes"
        command: "xcrun simctl list runtimes 2>/dev/null | grep -E '^(iOS|== )' || echo 'None (simctl not available)'"
      - label: "iOS Simulator devices"
        command: "xcrun simctl list devices available 2>/dev/null | grep -E '(^--|  )' | head -20 || echo 'None'"

  - name: Visual Studio Professional
    description: Microsoft IDE (C++/C#/.NET)
    profiles: [windows, build]
    platforms: [windows]
    check_command: devenv
    check_windows_path: "%PROGRAMFILES%\\Microsoft Visual Studio\\2022\\Professional\\Common7\\IDE\\devenv.exe"
    install_windows: "winget install -e --id Microsoft.VisualStudio.2022.Professional --accept-package-agreements --accept-source-agreements"

