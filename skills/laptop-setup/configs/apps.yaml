# =============================================================================
# Laptop Setup – Application Registry
# =============================================================================
# Each app entry uses a flat key structure for easy parsing:
#
#   name              – Display name
#   description       – Short description
#   profiles          – Optional profile tags such as [baseline, web, java]
#   bootstrap         – Optional true/false; install before non-bootstrap apps
#   platforms         – Inline list: [macos, windows, linux]
#   check_command     – Generic CLI command to detect (all platforms)
#   check_commands    – Generic CLI command list; any command detects the app
#   check_shell       – Generic shell command; exit 0 detects the app
#   check_path        – Generic file/dir path to detect
#   check_paths       – Generic file/dir path list; any path detects the app
#   check_<os>_path   – Platform-specific file/dir path to detect
#   check_<os>_paths  – Platform-specific file/dir path list
#   check_<os>_command – Platform-specific CLI command to detect
#   check_<os>_shell  – Platform-specific shell command; exit 0 detects app
#   install_<os>      – Install command for that platform
#   install_linux_<pm> – Linux package-manager-specific command (apt/dnf/snap)
#   install_linux_custom – Linux fallback install command
#   install_<os>_note – Post-install note shown to user
#   post_install_<os> – List of commands to run after install (or --setup)
#   verify_<os>       – List of {label, command} pairs for --verify checks
# =============================================================================

settings:
  ensure_package_manager: true
  log_file: "laptop_setup.log"

apps:

  # ── Containers ──────────────────────────────────────────────────────────
  - name: Docker Desktop
    description: Docker Desktop container runtime and GUI
    profiles: [containers]
    platforms: [macos, windows]
    check_macos_path: "/Applications/Docker.app"
    check_windows_path: "%PROGRAMFILES%\\Docker\\Docker\\Docker Desktop.exe"
    install_macos: "brew install --cask docker"
    install_windows: "winget install -e --id Docker.DockerDesktop --accept-package-agreements --accept-source-agreements"
    install_macos_note: "After install, launch Docker.app once to finish privileged helper and virtualization setup."
    install_windows_note: "After install, launch Docker Desktop once to finish WSL 2/backend setup if prompted."

  # ── AI & Runtime Tools ─────────────────────────────────────────────────
  - name: Node.js
    description: JavaScript runtime and npm package manager
    profiles: [baseline, web, ai]
    platforms: [macos, windows, linux]
    check_command: node
    install_macos: "brew install node"
    install_windows: "winget install -e --id OpenJS.NodeJS.LTS --accept-package-agreements --accept-source-agreements"
    install_linux_apt: "sudo apt install -y nodejs npm"
    install_linux_dnf: "sudo dnf install -y nodejs npm"
    install_linux_snap: "sudo snap install node --classic"
    install_linux_note: "Some Linux distro packages may lag the latest LTS. Copilot CLI requires Node.js 22+ when installed through npm."
    # Configure npm registry auth. Provide NPM_TOKEN via --credentials-file
    # for headless setup of the public npm registry; otherwise run
    # `npm login` interactively. Override NPM_REGISTRY for a private
    # registry (default: https://registry.npmjs.org/).
    configure_macos:
      - name: "Authenticate npm registry"
        check: "npm whoami >/dev/null 2>&1"
        interactive: "npm login"
        non_interactive: "npm config set //${NPM_REGISTRY:-registry.npmjs.org}/:_authToken \"$NPM_TOKEN\""
        requires: [NPM_TOKEN]
        sensitive: true
    configure_linux:
      - name: "Authenticate npm registry"
        check: "npm whoami >/dev/null 2>&1"
        interactive: "npm login"
        non_interactive: "npm config set //${NPM_REGISTRY:-registry.npmjs.org}/:_authToken \"$NPM_TOKEN\""
        requires: [NPM_TOKEN]
        sensitive: true
    configure_windows:
      - name: "Authenticate npm registry"
        check: "npm whoami >NUL 2>&1"
        interactive: "npm login"
        non_interactive: "npm config set //registry.npmjs.org/:_authToken \"%NPM_TOKEN%\""
        requires: [NPM_TOKEN]
        sensitive: true

  - name: ClaudeCode
    description: Claude Code terminal coding assistant
    profiles: [ai]
    platforms: [macos, windows, linux]
    check_command: claude
    install_macos: "brew install --cask claude-code"
    install_windows: "winget install -e --id Anthropic.ClaudeCode --accept-package-agreements --accept-source-agreements"
    install_linux_apt: "sudo install -d -m 0755 /etc/apt/keyrings && sudo curl -fsSL https://downloads.claude.ai/keys/claude-code.asc -o /etc/apt/keyrings/claude-code.asc && echo 'deb [signed-by=/etc/apt/keyrings/claude-code.asc] https://downloads.claude.ai/claude-code/apt/stable stable main' | sudo tee /etc/apt/sources.list.d/claude-code.list >/dev/null && sudo apt update && sudo apt install -y claude-code"
    install_linux_dnf: "printf '[claude-code]\\nname=Claude Code\\nbaseurl=https://downloads.claude.ai/claude-code/rpm/stable\\nenabled=1\\ngpgcheck=1\\ngpgkey=https://downloads.claude.ai/keys/claude-code.asc\\n' | sudo tee /etc/yum.repos.d/claude-code.repo >/dev/null && sudo dnf install -y claude-code"
    install_macos_note: "After install, run 'claude' or 'claude doctor' to authenticate and verify setup."
    install_windows_note: "After install, run 'claude' or 'claude doctor' to authenticate and verify setup."
    install_linux_note: "The official Linux packages use Anthropic's signed apt/dnf repositories."
    # Provide ANTHROPIC_API_KEY via --credentials-file for headless auth.
    # Without it, the interactive `claude` flow is used.
    configure_macos:
      - name: "Authenticate Claude Code"
        check: "claude doctor 2>/dev/null | grep -qi 'authenticated\\|ok'"
        interactive: "claude"
        non_interactive: "claude doctor"
        requires: [ANTHROPIC_API_KEY]
        sensitive: true
    configure_linux:
      - name: "Authenticate Claude Code"
        check: "claude doctor 2>/dev/null | grep -qi 'authenticated\\|ok'"
        interactive: "claude"
        non_interactive: "claude doctor"
        requires: [ANTHROPIC_API_KEY]
        sensitive: true
    configure_windows:
      - name: "Authenticate Claude Code"
        check: "claude doctor 2>NUL | findstr /i \"authenticated ok\""
        interactive: "claude"
        non_interactive: "claude doctor"
        requires: [ANTHROPIC_API_KEY]
        sensitive: true

  - name: Codex
    description: OpenAI Codex CLI coding agent
    profiles: [ai]
    platforms: [macos, windows, linux]
    check_command: codex
    install_macos: "npm install -g @openai/codex"
    install_windows: "npm install -g @openai/codex"
    install_linux_custom: "npm install -g @openai/codex"
    install_macos_note: "Requires Node.js/npm. After install, run 'codex --login' or configure OPENAI_API_KEY."
    install_windows_note: "Requires Node.js/npm. Windows support may require WSL depending on the local setup; run 'codex --login' after install."
    install_linux_note: "Requires Node.js/npm. After install, run 'codex --login' or configure OPENAI_API_KEY."
    # Provide OPENAI_API_KEY via --credentials-file for headless auth; the
    # Codex CLI reads it from the environment and skips the login prompt.
    configure_macos:
      - name: "Authenticate Codex"
        check: "codex auth status >/dev/null 2>&1 || [ -n \"$OPENAI_API_KEY\" ]"
        interactive: "codex --login"
        non_interactive: "codex auth status >/dev/null 2>&1 || true"
        requires: [OPENAI_API_KEY]
        sensitive: true
    configure_linux:
      - name: "Authenticate Codex"
        check: "codex auth status >/dev/null 2>&1 || [ -n \"$OPENAI_API_KEY\" ]"
        interactive: "codex --login"
        non_interactive: "codex auth status >/dev/null 2>&1 || true"
        requires: [OPENAI_API_KEY]
        sensitive: true
    configure_windows:
      - name: "Authenticate Codex"
        check: "codex auth status >NUL 2>&1"
        interactive: "codex --login"
        non_interactive: "codex auth status >NUL 2>&1"
        requires: [OPENAI_API_KEY]
        sensitive: true

  - name: Copilot CLI
    description: GitHub Copilot terminal coding assistant
    profiles: [ai]
    platforms: [macos, windows, linux]
    check_command: copilot
    install_macos: "brew install copilot-cli"
    install_windows: "winget install -e --id GitHub.Copilot --accept-package-agreements --accept-source-agreements"
    install_linux_custom: "if command -v brew >/dev/null 2>&1; then brew install copilot-cli; else npm install -g @github/copilot; fi"
    install_macos_note: "After install, run 'copilot' and use /login to authenticate with GitHub."
    install_windows_note: "After install, run 'copilot' and use /login to authenticate with GitHub."
    install_linux_note: "Uses Homebrew on Linux when available, otherwise npm. The npm package requires Node.js 22+."
    # Provide GITHUB_TOKEN via --credentials-file for headless auth; Copilot
    # CLI honours it and skips the /login flow.
    configure_macos:
      - name: "Authenticate Copilot CLI"
        check: "test -n \"$GITHUB_TOKEN\" || copilot --version >/dev/null 2>&1 && test -f \"$HOME/.config/github-copilot/hosts.json\""
        interactive: "copilot"
        non_interactive: "copilot --version"
        requires: [GITHUB_TOKEN]
        sensitive: true
    configure_linux:
      - name: "Authenticate Copilot CLI"
        check: "test -n \"$GITHUB_TOKEN\" || copilot --version >/dev/null 2>&1 && test -f \"$HOME/.config/github-copilot/hosts.json\""
        interactive: "copilot"
        non_interactive: "copilot --version"
        requires: [GITHUB_TOKEN]
        sensitive: true
    configure_windows:
      - name: "Authenticate Copilot CLI"
        check: "copilot --version >NUL 2>&1"
        interactive: "copilot"
        non_interactive: "copilot --version"
        requires: [GITHUB_TOKEN]
        sensitive: true

