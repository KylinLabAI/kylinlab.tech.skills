  # ── Build & Language Runtimes ──────────────────────────────────────────
  - name: Python
    description: Python 3 language runtime and package tooling
    profiles: [baseline]
    platforms: [macos, windows, linux]
    check_command: python3
    check_windows_command: python
    install_macos: "brew install python"
    install_windows: "winget install -e --id Python.Python.3 --accept-package-agreements --accept-source-agreements"
    install_linux_apt: "sudo apt install -y python3 python3-pip python3-venv"
    install_linux_dnf: "sudo dnf install -y python3 python3-pip"
    install_linux_snap: "sudo snap install python --classic"

  - name: CMake
    description: Cross-platform build system generator
    profiles: [build]
    platforms: [macos, windows, linux]
    check_command: cmake
    install_macos: "brew install cmake"
    install_windows: "winget install -e --id Kitware.CMake --accept-package-agreements --accept-source-agreements"
    install_linux_apt: "sudo apt install -y cmake"
    install_linux_dnf: "sudo dnf install -y cmake"
    install_linux_snap: "sudo snap install cmake --classic"

  - name: openjdk@21
    description: OpenJDK 21 development kit for Java
    profiles: [java]
    platforms: [macos, windows, linux]
    check_macos_paths: ["/opt/homebrew/opt/openjdk@21/bin/java", "/usr/local/opt/openjdk@21/bin/java"]
    check_windows_command: java
    check_linux_command: java
    install_macos: "brew install openjdk@21"
    install_windows: "winget install -e --id Microsoft.OpenJDK.21 --accept-package-agreements --accept-source-agreements"
    install_linux_apt: "sudo apt install -y openjdk-21-jdk"
    install_linux_dnf: "sudo dnf install -y java-21-openjdk-devel"
    install_macos_note: "Homebrew installs openjdk@21 as a keg-only formula. To expose it to system Java tools, follow 'brew info openjdk@21'."

  - name: maven
    description: Apache Maven Java build and dependency management tool
    profiles: [java]
    platforms: [macos, windows, linux]
    check_command: mvn
    install_macos: "brew install maven"
    install_windows: "powershell -NoProfile -ExecutionPolicy Bypass -Command \"if (Get-Command scoop -ErrorAction SilentlyContinue) { scoop install maven } elseif (Get-Command choco -ErrorAction SilentlyContinue) { choco install maven -y } else { Write-Error 'Install Scoop or Chocolatey first, then install Maven'; exit 1 }\""
    install_linux_apt: "sudo apt install -y maven"
    install_linux_dnf: "sudo dnf install -y maven"
    install_windows_note: "Maven is not consistently available through winget; this command uses Scoop or Chocolatey if present."

  - name: ripgrep
    description: Fast recursive text search tool (rg)
    profiles: [baseline]
    platforms: [macos, windows, linux]
    check_command: rg
    install_macos: "brew install ripgrep"
    install_windows: "winget install -e --id BurntSushi.ripgrep.MSVC --accept-package-agreements --accept-source-agreements"
    install_linux_apt: "sudo apt install -y ripgrep"
    install_linux_dnf: "sudo dnf install -y ripgrep"

  - name: p7zip
    description: 7-Zip compatible file archiver CLI
    profiles: [baseline]
    platforms: [macos, windows, linux]
    check_command: 7z
    check_windows_path: "%PROGRAMFILES%\\7-Zip\\7z.exe"
    install_macos: "brew install p7zip"
    install_windows: "winget install -e --id 7zip.7zip --accept-package-agreements --accept-source-agreements"
    install_linux_apt: "sudo apt install -y p7zip-full"
    install_linux_dnf: "sudo dnf install -y p7zip p7zip-plugins"

  - name: openssl
    description: OpenSSL cryptography and TLS toolkit
    profiles: [baseline, build]
    platforms: [macos, windows, linux]
    check_macos_paths: ["/opt/homebrew/opt/openssl@3/bin/openssl", "/usr/local/opt/openssl@3/bin/openssl"]
    check_windows_command: openssl
    check_linux_command: openssl
    install_macos: "brew install openssl@3"
    install_windows: "winget install -e --id ShiningLight.OpenSSL.Dev --accept-package-agreements --accept-source-agreements"
    install_linux_apt: "sudo apt install -y openssl"
    install_linux_dnf: "sudo dnf install -y openssl"
    install_macos_note: "Homebrew installs openssl@3 as a keg-only formula; use its opt path when a build needs this OpenSSL specifically."

  - name: jq
