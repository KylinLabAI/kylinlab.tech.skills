# =============================================================================
# AI Usage Report - External Tool Registry
# =============================================================================
# Drop-in extension for skills/laptop-setup.
# Install:
#   python3 skills/laptop-setup/scripts/laptop_setup.py --install \
#     --apps-file skills/ai-usage-report/configs/apps.yaml \
#     --profile ai-usage-report
# Or simply: python3 skills/ai-usage-report/scripts/init.py
# =============================================================================

settings:
  ensure_package_manager: true
  log_file: "ai_usage_report_setup.log"

apps:
  # Required to run the bundled usage analysis scripts.
  - name: "Python 3"
    profiles: ["ai-usage-report", "core"]
    category: "runtime"
    bootstrap: true
    platforms: [macos, windows, linux]
    check_command: "python3"
    install_macos: "brew install python"
    install_windows: "winget install -e --id Python.Python.3.12"
    install_linux_apt: "sudo apt-get update && sudo apt-get install -y python3 python3-pip"
    install_linux_dnf: "sudo dnf install -y python3 python3-pip"

  # Python packages listed in requirements.txt (kept in sync manually).
  # Needed for every workflow: xlsx/zip parsing, charts, and browser capture.
  - name: "AI Usage Report Python dependencies"
    description: "openpyxl, matplotlib, playwright (mirrors requirements.txt)"
    profiles: ["ai-usage-report"]
    platforms: [macos, windows, linux]
    check_shell: "python3 -c \"import openpyxl, matplotlib, playwright\""
    install_macos: "python3 -m pip install --break-system-packages openpyxl matplotlib playwright"
    install_windows: "python3 -m pip install openpyxl matplotlib playwright"
    install_linux_apt: "python3 -m pip install --break-system-packages openpyxl matplotlib playwright"
    install_linux_dnf: "python3 -m pip install --break-system-packages openpyxl matplotlib playwright"
    # Browser capture (scrape_usage.py) needs the Chromium build. post_install
    # only runs when this app was just installed; if Playwright was already
    # present, run the command manually once.
    post_install_macos:
      - "python3 -m playwright install chromium"
    post_install_windows:
      - "python3 -m playwright install chromium"
    post_install_linux:
      - "python3 -m playwright install chromium"
